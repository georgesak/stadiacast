name: Linux lab

# The Linux-only paths against the real thing, by hand: the uinput device `--gamepad uinput`
# creates, read back through its event device as a game reads it, a game's force feedback, the
# whole path from the lab controller to the pad and back to its motors, the HID devices
# `--gamepad uhid` and `--gamepad dualsense` create, `--audio-source system` recording a tone from a PulseAudio server,
# and `--mic-device` making a microphone in it. With ffmpeg installed, the sound tests that the
# regular CI skips run here too. Nothing is released.
#
# The pad tests need a kernel with uinput, and the Stadia and DualSense pads' one with uhid. Where
# a runner's kernel has none, the step that prepares it says so and they skip; point `runner` at a
# self-hosted Linux machine then.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runs-on label: ubuntu-latest (hosted) or a self-hosted Linux runner"
        default: ubuntu-latest
        required: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: PortAudio for the audio extra, ffmpeg, and a sound server
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 ffmpeg pulseaudio pulseaudio-utils
      - run: uv sync --all-extras --locked

      - name: start the sound server, with the silent output it makes for a machine without a sound card
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl info | grep -E "Server Name|Default Sink|Default Source"

      - name: give the runner's user uinput, uhid and the pads they create
        run: |
          uname -r
          if [ ! -e /dev/uinput ] || ! sudo modprobe uhid; then
            sudo modprobe uinput || sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe uinput || true
            sudo modprobe uhid || true
          fi
          # The job has no login session with a seat, so the rules name a mode instead of the tag
          # the README gives a person at the computer.
          {
            echo 'KERNEL=="uinput", SUBSYSTEM=="misc", MODE="0666", OPTIONS+="static_node=uinput"'
            echo 'KERNEL=="uhid", SUBSYSTEM=="misc", MODE="0666", OPTIONS+="static_node=uhid"'
            echo 'KERNEL=="hidraw*", SUBSYSTEM=="hidraw", KERNELS=="0003:18D1:9400.*", MODE="0666"'
            echo 'KERNEL=="hidraw*", SUBSYSTEM=="hidraw", KERNELS=="0003:054C:0CE6.*", MODE="0666"'
            echo 'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"'
          } | sudo tee /etc/udev/rules.d/99-stadiacast-lab.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=uinput --name-match=uhid || true
          sleep 1
          if [ -c /dev/uinput ]; then
            ls -l /dev/uinput
            echo "STADIACAST_LINUX_LAB=1" >> "$GITHUB_ENV"
          else
            echo "::warning::this runner's kernel has no uinput device: the lab tests skip"
          fi
          if [ -c /dev/uhid ]; then
            ls -l /dev/uhid
            modinfo -F filename hid-google-stadiaff || echo "no hid-google-stadiaff: the Stadia pad stays with hid-generic"
            modinfo -F filename hid-playstation || echo "no hid-playstation: the DualSense pad stays with hid-generic"
          else
            echo "::warning::this runner's kernel has no uhid device: the Stadia and DualSense pads' lab tests skip"
          fi

      - name: the whole test suite, with the pad on a real kernel where there is one
        run: uv run pytest -q -rs

      - name: what the kernel and udev make of a pad
        if: env.STADIACAST_LINUX_LAB == '1'
        run: |
          uv run python - <<'PY'
          import subprocess, time
          from stadiacast.gamepad import GamepadState
          from stadiacast.uinput_gamepad import UinputPad

          pad = UinputPad("lab")
          pad.apply(GamepadState().to_xinput())
          time.sleep(1)
          print("event device:", pad.device)
          print(open("/proc/bus/input/devices").read().split("\n\n")[-2])
          print(subprocess.run(["udevadm", "info", str(pad.device)], capture_output=True, text=True).stdout)
          pad.close()
          PY

      - name: what the kernel and udev make of a Stadia pad
        if: env.STADIACAST_LINUX_LAB == '1'
        run: |
          [ -w /dev/uhid ] || { echo "no uhid to write to"; exit 0; }
          uv run python - <<'PY'
          import subprocess, time
          from stadiacast.gamepad import GamepadState
          from stadiacast.uhid_gamepad import UhidPad

          pad = UhidPad("lab")
          pad.apply_state(GamepadState())
          time.sleep(1)
          print("hidraw node:", pad.device)
          print(open("/proc/bus/input/devices").read().split("\n\n")[-2])
          print(subprocess.run(["udevadm", "info", str(pad.device)], capture_output=True, text=True).stdout)
          print(subprocess.run("dmesg | tail -5", shell=True, capture_output=True, text=True).stdout)
          pad.close()
          PY

      - name: what the kernel and udev make of a DualSense pad
        if: env.STADIACAST_LINUX_LAB == '1'
        run: |
          [ -w /dev/uhid ] || { echo "no uhid to write to"; exit 0; }
          uv run python - <<'PY'
          import glob, os, subprocess, time
          from stadiacast.dualsense_gamepad import DualSensePad

          pad = DualSensePad("lab", "99181FFAZ00123")
          pad.set_battery(76)
          time.sleep(1)
          device = os.path.realpath(f"/sys/class/hidraw/{os.path.basename(str(pad.device))}/device")
          print("hidraw node:", pad.device, "address:", pad.uniq, "driver:", os.path.basename(os.path.realpath(device + "/driver")))
          for name in sorted(glob.glob(device + "/input/input*/name")):
              print("input device:", open(name).read().strip())
          for supply in glob.glob(device + "/power_supply/*"):
              print("battery:", open(supply + "/status").read().strip(), open(supply + "/capacity").read().strip())
          print(subprocess.run(["udevadm", "info", str(pad.device)], capture_output=True, text=True).stdout)
          print(subprocess.run("sudo dmesg | tail -8", shell=True, capture_output=True, text=True).stdout)
          pad.close()
          PY
